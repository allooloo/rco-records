# rco-door — RCO-MOVE (Allooloo build memo v1.0, 2026-10-29): the Record of Cleared Orders under Allooloo Technologies Corp. Account dd2832…
# ("Allooloo Agent Traffic" on the wire — the one Cloudflare account; no re-home needed). D1 rco-receipts, Ed25519 kid rco-allooloo-2026-10.
# Four custom domains: the new hosts, and the old names as permanent 301s (MCP POST on mcp.rco-a2a.ai answered as an alias for six months).
name = "rco-door"
main = "worker/index.js"
compatibility_date = "2026-10-01"
account_id = "dd2832b36f171b815f84c8487aada36b"
workers_dev = false
routes = [
  { pattern = "mcp.rco-records.ai", custom_domain = true },
  { pattern = "rco-records.ai",     custom_domain = true },
  { pattern = "mcp.rco-a2a.ai",     custom_domain = true },
  { pattern = "rco-a2a.ai",         custom_domain = true }
]

[triggers]
crons = ["30 5 * * *"]   # nightly export of the full table (UTC); puts only when EXPORT_KEY_ID / EXPORT_SECRET are placed (the CEO's hand)

[vars]
VERSION = "2.2.0"
AS_OF = "2026-10-30"
KID = "rco-allooloo-2026-10"
EXPORT_BUCKET = "rco-receipts-copy"
EXPORT_REGION = "us-east-1"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"        # the Worker serves the pages itself; no /index.html → / redirect inside ASSETS.fetch
not_found_handling = "none"   # a missing asset is a real 404, never an HTML fallback

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "rco-receipts"
database_id = "111a8a79-4a2b-47e5-81a3-c7b7ab4dd4c6"
